<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Dino Kart — una gara di kart in prima persona, per tablet.">
<meta name="theme-color" content="#1b2740">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dino Kart">
<title>Dino Kart</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  overflow: hidden; background: #0b2418;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  overscroll-behavior: none; touch-action: none;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
#c { position: fixed; inset: 0; display: block; touch-action: none; }

/* ---- text entry overlay (only place we use DOM: we want the native keyboard) ---- */
#ovl {
  position: fixed; inset: 0; display: none; z-index: 10;
  align-items: center; justify-content: center;
  background: rgba(8, 26, 18, .72); backdrop-filter: blur(3px);
  padding: 16px;
}
#ovl.on { display: flex; }
#ovl .card {
  background: #fff6e0; border: 6px solid #7a4a26; border-radius: 26px;
  padding: 22px 24px; width: min(460px, 92vw);
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
}
#ovl h2 { margin: 0 0 14px; font-size: 24px; color: #2b1d12; font-weight: 800; }
#ovl input {
  width: 100%; font-size: 26px; padding: 12px 14px; border-radius: 14px;
  border: 4px solid #cdb389; background: #fffdf6; color: #2b1d12;
  font-family: inherit; font-weight: 700; outline: none;
}
#ovl input:focus { border-color: #2f8f4e; }
#ovl .row { display: flex; gap: 12px; margin-top: 18px; }
#ovl button {
  flex: 1; font-size: 22px; font-weight: 800; padding: 14px 10px;
  border-radius: 16px; border: none; color: #fff; font-family: inherit;
  cursor: pointer; min-height: 60px;
}
#ovl .ok { background: #2f8f4e; }
#ovl .no { background: #a8998a; }

/* ---- portrait nudge ---- */
#rot {
  position: fixed; inset: 0; display: none; z-index: 20;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; background: #123d29; color: #fff6e0; text-align: center; padding: 30px;
}
#rot.on { display: flex; }
#rot .ico { font-size: 84px; animation: tilt 1.8s ease-in-out infinite; }
#rot p { font-size: 26px; font-weight: 800; margin: 0; line-height: 1.35; }
@keyframes tilt { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } }

@media (prefers-reduced-motion: reduce) { #rot .ico { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ovl" role="dialog" aria-modal="true">
  <div class="card">
    <h2 id="ovl-t">Come ti chiami?</h2>
    <input id="ovl-i" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="14">
    <div class="row">
      <button class="no" id="ovl-n">Annulla</button>
      <button class="ok" id="ovl-y">Va bene</button>
    </div>
  </div>
</div>

<div id="rot"><div class="ico">📱</div><p>Gira il tablet<br>di lato!</p></div>

<script>
/* ==================== 00-core.js ==================== */
/* Dino Kart — core engine.
   Fixed 1280x720 logical world, letterboxed. Canvas only, no assets, no deps.
   Everything a scene needs hangs off the global `G`. */
(function () {
  'use strict';

  var W = 1280, H = 720;
  var G = (window.G = { W: W, H: H, t: 0, dt: 0, frame: 0 });

  /* ---------------------------------------------------------------- palette */
  G.C = {
    leaf: '#2f8f4e', leafDark: '#1c5c33', leafLight: '#63c777', leafDeep: '#123d29',
    bark: '#7a4a26', barkDark: '#4e2f18',
    sky: '#8fd8e8', skyDeep: '#4bb6d6', sun: '#ffd75e',
    sand: '#f2d9a8', water: '#3fb6c9',
    cream: '#fff6e0', ink: '#2b1d12', shadow: 'rgba(20,10,0,.22)',
    berry: '#e8536b', plum: '#8f5bd6', tangerine: '#ff9f43', mint: '#38d9a9',
    pinkPop: '#ff6fae', blueberry: '#4d80e4',
    dino: '#57c98a', dinoDark: '#379a67', dinoBelly: '#f6e7c1'
  };

  /* ------------------------------------------------------------------ maths */
  G.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  G.lerp = function (a, b, t) { return a + (b - a) * t; };
  G.ease = function (t) { t = G.clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
  G.easeIn = function (t) { t = G.clamp(t, 0, 1); return t * t * t; };
  G.easeInOut = function (t) { t = G.clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  G.easeBack = function (t) { t = G.clamp(t, 0, 1); var c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  G.rnd = function (a, b) { if (b === undefined) { b = a; a = 0; } return a + Math.random() * (b - a); };
  G.rndi = function (a, b) { return Math.floor(a + Math.random() * (b - a + 1)); };
  G.pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
  G.shuffle = function (arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  G.dist = function (ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); };

  /* ------------------------------------------------------------- canvas fit */
  var cv = document.getElementById('c');
  var ctx = (G.ctx = cv.getContext('2d', { alpha: false }));
  var view = { s: 1, ox: 0, oy: 0, dpr: 1 };
  G.view = view;
  var rotEl = document.getElementById('rot');

  function resize() {
    var cw = window.innerWidth, ch = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    view.dpr = dpr;
    view.s = Math.min(cw / W, ch / H);
    view.ox = (cw - W * view.s) / 2;
    view.oy = (ch - H * view.s) / 2;
    cv.width = Math.max(1, Math.round(cw * dpr));
    cv.height = Math.max(1, Math.round(ch * dpr));
    cv.style.width = cw + 'px';
    cv.style.height = ch + 'px';
    ctx.imageSmoothingEnabled = true;
    if (rotEl) rotEl.classList.toggle('on', ch > cw * 1.08);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  resize();

  /* -------------------------------------------------------------- draw help */
  var FONT = '"Trebuchet MS", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif';
  G.font = function (size, weight) { return (weight || 900) + ' ' + size + 'px ' + FONT; };

  G.text = function (str, x, y, o) {
    o = o || {};
    var c = o.ctx || ctx;
    c.save();
    c.font = G.font(o.size || 32, o.weight);
    c.textAlign = o.align || 'center';
    c.textBaseline = o.baseline || 'middle';
    if (o.stroke) {
      c.lineWidth = o.strokeWidth || Math.max(4, (o.size || 32) * .16);
      c.strokeStyle = o.stroke; c.lineJoin = 'round';
      c.strokeText(str, x, y, o.maxWidth);
    }
    c.fillStyle = o.color || G.C.ink;
    c.fillText(str, x, y, o.maxWidth);
    c.restore();
  };

  G.roundRect = function (c, x, y, w, h, r) {
    r = Math.min(r || 0, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  };
  G.shadow = function (c, blur, color, dy) {
    c.shadowBlur = blur; c.shadowColor = color || G.C.shadow;
    c.shadowOffsetX = 0; c.shadowOffsetY = dy === undefined ? blur * .35 : dy;
  };
  G.noShadow = function (c) { c.shadowBlur = 0; c.shadowColor = 'transparent'; c.shadowOffsetX = 0; c.shadowOffsetY = 0; };

  /* ------------------------------------------------------------------ audio */
  var AC = null, master = null, noiseBuf = null;
  function audio() {
    if (AC) return AC;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = .5;
    master.connect(AC.destination);
    var n = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate), d = n.getChannelData(0), i;
    for (i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    noiseBuf = n;
    return AC;
  }
  G.resumeAudio = function () { var a = audio(); if (a && a.state === 'suspended') a.resume(); };

  function tone(freq, at, dur, type, gain, slideTo) {
    var a = audio(); if (!a) return;
    var t0 = a.currentTime + at;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || .22, t0 + Math.min(.02, dur * .3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + .02);
  }
  function noise(at, dur, gain, freq) {
    var a = audio(); if (!a || !noiseBuf) return;
    var t0 = a.currentTime + at;
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq || 1400; f.Q.value = .8;
    g.gain.setValueAtTime(gain || .18, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0 + dur);
  }

  var SFX = {
    tap: function () { tone(680, 0, .07, 'sine', .16, 880); },
    pop: function () { tone(900, 0, .12, 'sine', .2, 420); },
    good: function () { tone(523, 0, .12, 'triangle', .2); tone(659, .09, .12, 'triangle', .2); tone(784, .18, .2, 'triangle', .22); },
    bad: function () { tone(320, 0, .16, 'sine', .16, 240); },
    coin: function () { tone(1180, 0, .07, 'square', .1); tone(1560, .06, .12, 'square', .1); },
    chime: function () { tone(1046, 0, .5, 'sine', .16); tone(1568, .02, .45, 'sine', .07); },
    whoosh: function () { noise(0, .22, .1, 900); },
    win: function () {
      [523, 659, 784, 1046].forEach(function (f, i) { tone(f, i * .1, .3, 'triangle', .2); });
      tone(1318, .42, .5, 'sine', .14);
    },
    hatch: function () { noise(0, .1, .12, 2400); tone(600, .08, .2, 'triangle', .18, 1000); }
  };
  G.sfx = function (name) {
    if (G.save && G.save.mute) return;
    var f = SFX[name]; if (f) { audio(); if (AC) f(); }
  };

  /* ----------------------------------------------------------------- speech */
  var voice = null, voiceTried = false;
  function findVoice() {
    if (!window.speechSynthesis) return null;
    var vs = speechSynthesis.getVoices() || [];
    if (!vs.length) return null;
    return vs.filter(function (v) { return /^it/i.test(v.lang); })[0] || null;
  }
  if (window.speechSynthesis) {
    speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', function () { voice = findVoice(); });
  }
  G.say = function (str, o) {
    if (!window.speechSynthesis || !str) return;
    if (G.save && G.save.mute) return;
    o = o || {};
    if (!voiceTried) { voice = findVoice(); voiceTried = true; }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(str));
      u.lang = 'it-IT';
      if (voice) u.voice = voice;
      u.rate = o.rate || .95;
      u.pitch = o.pitch || 1.15;
      u.volume = o.volume === undefined ? 1 : o.volume;
      speechSynthesis.speak(u);
    } catch (e) { /* speech is a bonus, never a blocker */ }
  };
  G.hush = function () { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} };

  /* ---------------------------------------------------------------- storage */
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  G.LS = LS;

  var K_ACCTS = 'dk.accounts', K_LAST = 'dk.last', K_SAVE = 'dk.save.';

  function blankSave() {
    return {
      fruits: 0, stars: 0, mute: false, hat: null, hats: [],
      conta: {}, fili: {}, nido: {}, seen: {}, playSec: 0, updated: 0
    };
  }
  function fillSave(s) {
    var b = blankSave(), k;
    for (k in b) if (s[k] === undefined || s[k] === null) s[k] = b[k];
    return s;
  }

  G.account = null;
  G.profile = null;
  G.level = 1;
  G.save = blankSave();

  var saveTimer = 0, saveDirty = false;
  function writeSave() {
    if (!G.account) return;
    G.save.updated = Date.now();
    LS.set(K_SAVE + G.account.id, G.save);
    saveDirty = false;
    if (G.cloud && G.cloud.push) G.cloud.push();
  }
  G.saveNow = function () { saveDirty = true; };
  G.saveFlush = writeSave;

  G.accounts = {
    list: function () { return LS.get(K_ACCTS, []); },
    byId: function (id) { return G.accounts.list().filter(function (a) { return a.id === id; })[0] || null; },
    create: function (o) {
      var list = G.accounts.list();
      var acct = {
        id: 'a' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
        name: (o.name || 'Dino').slice(0, 14),
        color: o.color || G.C.dino,
        level: o.level === 2 ? 2 : 1,
        secret: o.secret && o.secret.length ? o.secret : null,
        created: Date.now()
      };
      list.push(acct);
      LS.set(K_ACCTS, list);
      LS.set(K_SAVE + acct.id, blankSave());
      return acct;
    },
    update: function (id, patch) {
      var list = G.accounts.list(), i;
      for (i = 0; i < list.length; i++) if (list[i].id === id) {
        for (var k in patch) list[i][k] = patch[k];
        LS.set(K_ACCTS, list);
        if (G.account && G.account.id === id) G.account = list[i];
        return list[i];
      }
      return null;
    },
    remove: function (id) {
      LS.set(K_ACCTS, G.accounts.list().filter(function (a) { return a.id !== id; }));
      LS.del(K_SAVE + id);
      if (LS.get(K_LAST, null) === id) LS.del(K_LAST);
    },
    login: function (id) {
      var a = G.accounts.byId(id);
      if (!a) return false;
      G.account = a;
      G.profile = a.id;
      G.level = a.level;
      G.save = fillSave(LS.get(K_SAVE + id, blankSave()));
      LS.set(K_LAST, id);
      if (G.cloud && G.cloud.pull) G.cloud.pull();
      return true;
    },
    logout: function () {
      writeSave();
      G.hush();
      G.account = null; G.profile = null; G.save = blankSave();
      LS.del(K_LAST);
    },
    last: function () { return LS.get(K_LAST, null); }
  };

  /* ------------------------------------------------------------------ input */
  var pointer = { x: 0, y: 0, down: false, id: null };
  G.pointer = pointer;

  function toLogical(clientX, clientY) {
    var r = cv.getBoundingClientRect();
    return {
      x: (clientX - r.left - view.ox) / view.s,
      y: (clientY - r.top - view.oy) / view.s
    };
  }

  /* --------------------------------------------------- immediate-mode UI */
  var uiRects = [];       // registered this frame
  var uiHot = [];         // registered last frame (what the pointer tests against)
  var pressedKey = null;
  var ui = (G.ui = {});

  function rectKey(o) { return o.id || (o.label || '') + '|' + Math.round(o.x) + ',' + Math.round(o.y) + ',' + Math.round(o.w) + ',' + Math.round(o.h); }

  function shade(hex, amt) {
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    if (!m) return hex;
    var f = function (h) { return G.clamp(Math.round(parseInt(h, 16) + amt), 0, 255); };
    var to = function (v) { return ('0' + v.toString(16)).slice(-2); };
    return '#' + to(f(m[1])) + to(f(m[2])) + to(f(m[3]));
  }
  G.shade = shade;

  ui.button = function (o) {
    var c = o.ctx || ctx;
    var key = rectKey(o);
    var down = pressedKey === key && !o.disabled;
    var r = o.r === undefined ? Math.min(26, o.h * .32) : o.r;
    var col = o.disabled ? '#b9ada0' : (o.color || G.C.leaf);
    var dy = down ? 5 : 0;

    c.save();
    c.globalAlpha = o.disabled ? .72 : 1;
    if (o.ghost) {
      // Invisible hit area over artwork drawn by the scene (e.g. a player card).
      if (down) {
        c.fillStyle = 'rgba(20,10,0,.14)';
        G.roundRect(c, o.x, o.y, o.w, o.h, r); c.fill();
      }
    } else {
      // base (the "3d" underside)
      c.fillStyle = shade(col, -48);
      G.roundRect(c, o.x, o.y + 7, o.w, o.h, r); c.fill();
      // face
      var g = c.createLinearGradient(0, o.y + dy, 0, o.y + o.h + dy);
      g.addColorStop(0, shade(col, 26)); g.addColorStop(1, col);
      c.fillStyle = g;
      G.roundRect(c, o.x, o.y + dy, o.w, o.h, r); c.fill();
      // gloss
      c.fillStyle = 'rgba(255,255,255,.20)';
      G.roundRect(c, o.x + o.w * .06, o.y + dy + o.h * .10, o.w * .88, o.h * .30, r * .7); c.fill();
    }

    var cx = o.x + o.w / 2, cy = o.y + dy + o.h / 2;
    if (o.icon) {
      var isz = o.iconSize || Math.min(o.w, o.h) * .52;
      o.icon(c, o.label ? o.x + o.h * .58 : cx, cy, isz);
    }
    if (o.label) {
      var tx = o.icon ? cx + o.h * .26 : cx;
      G.text(o.label, tx, o.sub ? cy - o.h * .12 : cy, {
        ctx: c, size: o.fontSize || Math.min(o.h * .40, 46),
        color: o.textColor || '#fff', stroke: o.outline || 'rgba(0,0,0,.22)',
        maxWidth: o.w - (o.icon ? o.h * .9 : o.w * .12)
      });
      if (o.sub) G.text(o.sub, tx, cy + o.h * .24, { ctx: c, size: o.h * .21, color: 'rgba(255,255,255,.9)', weight: 700 });
    }
    c.restore();

    if (!o.disabled) uiRects.push({ key: key, x: o.x, y: o.y, w: o.w, h: o.h, onTap: o.onTap, silent: o.silent, round: false });
    return down;
  };

  ui.round = function (o) {
    var c = o.ctx || ctx;
    var key = o.id || 'r' + Math.round(o.x) + ',' + Math.round(o.y);
    var down = pressedKey === key && !o.disabled;
    var col = o.disabled ? '#b9ada0' : (o.color || G.C.cream);
    var dy = down ? 4 : 0;
    c.save();
    c.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
    c.fillStyle = shade(col, -50);
    c.beginPath(); c.arc(o.x, o.y + 6, o.r, 0, 7); c.fill();
    c.fillStyle = col;
    c.beginPath(); c.arc(o.x, o.y + dy, o.r, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.25)';
    c.beginPath(); c.arc(o.x, o.y + dy - o.r * .22, o.r * .74, Math.PI, 0); c.fill();
    if (o.icon) o.icon(c, o.x, o.y + dy, o.r * 1.05);
    c.restore();
    if (!o.disabled) uiRects.push({ key: key, x: o.x - o.r, y: o.y - o.r, w: o.r * 2, h: o.r * 2, onTap: o.onTap, silent: o.silent, round: true, cx: o.x, cy: o.y, cr: o.r });
    return down;
  };

  function hitTest(p) {
    var i, r;
    for (i = uiHot.length - 1; i >= 0; i--) {
      r = uiHot[i];
      if (r.round) { if (G.dist(p.x, p.y, r.cx, r.cy) <= r.cr + 12) return r; }
      else if (p.x >= r.x - 6 && p.x <= r.x + r.w + 6 && p.y >= r.y - 6 && p.y <= r.y + r.h + 6) return r;
    }
    return null;
  }

  /* ----------------------------------------------------------------- scenes */
  var scenes = {};
  var cur = null, curName = '';
  var fade = { a: 0, dir: 0, next: null, params: null };
  G.current = '';

  G.scene = function (name, obj) { scenes[name] = obj; obj._name = name; return obj; };
  G.go = function (name, params) {
    if (!scenes[name]) { console.warn('scena assente:', name); return; }
    if (fade.dir === 1) return;                 // a transition is already under way
    fade.dir = 1; fade.next = name; fade.params = params || null;
    G.hush();
  };
  G.home = function () { G.go('giungla'); };
  G.sceneOf = function (n) { return scenes[n]; };

  function swap() {
    if (cur && cur.exit) { try { cur.exit(); } catch (e) { console.error(e); } }
    writeSave();
    cur = scenes[fade.next];
    curName = fade.next; G.current = curName;
    uiRects = []; uiHot = []; pressedKey = null;
    if (cur && cur.enter) { try { cur.enter(fade.params); } catch (e) { console.error(e); } }
  }

  /* --------------------------------------------------------------- effects */
  var parts = [], floats = [], rings = [], flyers = [];
  var shakeAmt = 0;
  G.shake = function (a) { shakeAmt = Math.min(10, Math.max(shakeAmt, a || 4)); };

  var fx = (G.fx = {});
  fx.burst = function (x, y, o) {
    o = o || {};
    var n = o.count || 14, i, a, sp;
    for (i = 0; i < n; i++) {
      a = o.angle === undefined ? G.rnd(0, Math.PI * 2) : o.angle + G.rnd(-.7, .7);
      sp = (o.speed || 260) * G.rnd(.45, 1.2);
      parts.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.lift || 0),
        life: o.life || G.rnd(.5, .95), age: 0, size: (o.size || 12) * G.rnd(.6, 1.25),
        color: o.color || G.C.sun, grav: o.gravity === undefined ? 620 : o.gravity,
        shape: o.shape || 'circle', spin: G.rnd(-8, 8), rot: G.rnd(0, 6.3)
      });
    }
  };
  fx.confetti = function () {
    var cols = [G.C.berry, G.C.sun, G.C.mint, G.C.pinkPop, G.C.blueberry, G.C.tangerine], i;
    for (i = 0; i < 90; i++) {
      parts.push({
        x: G.rnd(0, W), y: G.rnd(-160, -10), vx: G.rnd(-70, 70), vy: G.rnd(120, 330),
        life: G.rnd(1.6, 2.8), age: 0, size: G.rnd(9, 18), color: cols[i % cols.length],
        grav: 90, shape: 'rect', spin: G.rnd(-9, 9), rot: G.rnd(0, 6.3)
      });
    }
  };
  fx.text = function (x, y, str, color, size) {
    floats.push({ x: x, y: y, str: String(str), color: color || G.C.cream, size: size || 42, age: 0, life: 1.1 });
  };
  fx.ring = function (x, y, color, max) {
    rings.push({ x: x, y: y, color: color || '#fff', age: 0, life: .55, max: max || 130 });
  };

  var HUD_FRUIT = { x: 48, y: 46 }, HUD_STAR = { x: 212, y: 46 };
  function flyTo(n, x, y, target, kind) {
    var i, count = G.clamp(n, 1, 10);
    var per = Math.floor(n / count), rest = n - per * count;
    for (i = 0; i < count; i++) {
      flyers.push({
        x: x === undefined ? W / 2 : x + G.rnd(-24, 24),
        y: y === undefined ? H / 2 : y + G.rnd(-24, 24),
        tx: target.x, ty: target.y, age: 0, delay: i * .055,
        life: .62, val: per + (i < rest ? 1 : 0), kind: kind
      });
    }
  }
  G.addFruits = function (n, x, y) {
    n = Math.round(n); if (n <= 0) return;
    flyTo(n, x, y, HUD_FRUIT, 'fruit'); G.sfx('coin');
  };
  G.addStars = function (n, x, y) {
    n = Math.round(n); if (n <= 0) return;
    flyTo(n, x, y, HUD_STAR, 'star'); G.sfx('chime');
  };
  G.spend = function (n) {
    if (G.save.fruits < n) return false;
    G.save.fruits -= n; G.saveNow(); G.sfx('pop'); return true;
  };

  function stepFx(dt) {
    var i, p;
    for (i = parts.length - 1; i >= 0; i--) {
      p = parts[i]; p.age += dt;
      if (p.age >= p.life) { parts.splice(i, 1); continue; }
      p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
    }
    for (i = floats.length - 1; i >= 0; i--) {
      p = floats[i]; p.age += dt; p.y -= 62 * dt;
      if (p.age >= p.life) floats.splice(i, 1);
    }
    for (i = rings.length - 1; i >= 0; i--) {
      p = rings[i]; p.age += dt; if (p.age >= p.life) rings.splice(i, 1);
    }
    for (i = flyers.length - 1; i >= 0; i--) {
      p = flyers[i];
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.age += dt;
      if (p.age >= p.life) {
        if (p.kind === 'star') G.save.stars += p.val; else G.save.fruits += p.val;
        G.saveNow();
        fx.ring(p.tx, p.ty, p.kind === 'star' ? G.C.sun : G.C.berry, 60);
        flyers.splice(i, 1);
      }
    }
    if (shakeAmt > 0) shakeAmt = Math.max(0, shakeAmt - dt * 22);
  }

  function drawParts(c) {
    var i, p, k;
    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      k = 1 - p.age / p.life;
      c.save();
      c.globalAlpha = G.clamp(k * 1.6, 0, 1);
      c.translate(p.x, p.y); c.rotate(p.rot);
      c.fillStyle = p.color;
      if (p.shape === 'rect') c.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * .66);
      else if (p.shape === 'star') { starPath(c, 0, 0, p.size); c.fill(); }
      else { c.beginPath(); c.arc(0, 0, p.size / 2, 0, 7); c.fill(); }
      c.restore();
    }
    for (i = 0; i < rings.length; i++) {
      p = rings[i]; k = p.age / p.life;
      c.save();
      c.globalAlpha = (1 - k) * .8;
      c.strokeStyle = p.color; c.lineWidth = 8 * (1 - k) + 2;
      c.beginPath(); c.arc(p.x, p.y, G.ease(k) * p.max, 0, 7); c.stroke();
      c.restore();
    }
    for (i = 0; i < floats.length; i++) {
      p = floats[i]; k = p.age / p.life;
      c.save();
      c.globalAlpha = 1 - k * k;
      G.text(p.str, p.x, p.y, { ctx: c, size: p.size, color: p.color, stroke: 'rgba(40,20,0,.5)' });
      c.restore();
    }
  }
  function drawFlyers(c) {
    var i, p, k, x, y;
    for (i = 0; i < flyers.length; i++) {
      p = flyers[i];
      if (p.delay > 0) continue;
      k = G.ease(p.age / p.life);
      x = G.lerp(p.x, p.tx, k);
      y = G.lerp(p.y, p.ty, k) - Math.sin(k * Math.PI) * 90;
      if (p.kind === 'star') starIcon(c, x, y, 22);
      else if (window.A && A.fruit) A.fruit(c, x, y, 20, 'fragola');
      else { c.fillStyle = G.C.berry; c.beginPath(); c.arc(x, y, 16, 0, 7); c.fill(); }
    }
  }

  function starPath(c, x, y, r) {
    var i, a, rr;
    c.beginPath();
    for (i = 0; i < 10; i++) {
      a = -Math.PI / 2 + i * Math.PI / 5;
      rr = i % 2 ? r * .46 : r;
      c[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    c.closePath();
  }
  G.starPath = starPath;
  function starIcon(c, x, y, r) {
    c.save();
    c.fillStyle = G.C.sun; c.strokeStyle = '#c8901c'; c.lineWidth = Math.max(2, r * .12);
    starPath(c, x, y, r); c.fill(); c.stroke();
    c.restore();
  }
  G.starIcon = starIcon;

  /* -------------------------------------------------------------------- HUD */
  var gearHold = 0;
  function drawHUD(c) {
    if (!cur || cur.hud === false || !G.account) return;
    var pill = function (x, w, drawIcon, value, col) {
      c.save();
      G.shadow(c, 12, 'rgba(0,0,0,.28)', 4);
      c.fillStyle = 'rgba(255,246,224,.94)';
      G.roundRect(c, x, 16, w, 60, 30); c.fill();
      G.noShadow(c);
      c.restore();
      drawIcon(c, x + 32, 46, 24);
      // maxWidth or the fruit counter runs out of its own pill at five digits
      // and lands on the star pill, which starts at x = 180.
      G.text(String(value), x + 62, 47, {
        ctx: c, size: 34, color: col, align: 'left', maxWidth: w - 74
      });
    };
    pill(16, 150, function (cc, x, y, r) {
      if (window.A && A.fruit) A.fruit(cc, x, y, r, 'fragola');
      else { cc.fillStyle = G.C.berry; cc.beginPath(); cc.arc(x, y, r, 0, 7); cc.fill(); }
    }, Math.floor(G.save.fruits), G.C.ink);
    pill(180, 132, function (cc, x, y, r) { starIcon(cc, x, y, r); }, Math.floor(G.save.stars), G.C.ink);

    // right cluster
    if (cur.back !== false && curName !== 'giungla') {
      ui.round({
        x: W - 60, y: 48, r: 40, color: G.C.tangerine, id: 'hud-home',
        icon: function (cc, x, y, r) {
          cc.save(); cc.strokeStyle = '#5b2c00'; cc.fillStyle = '#fff6e0';
          cc.lineWidth = 5; cc.lineJoin = 'round';
          cc.beginPath();
          cc.moveTo(x - r * .42, y + r * .04); cc.lineTo(x, y - r * .40); cc.lineTo(x + r * .42, y + r * .04);
          cc.lineTo(x + r * .30, y + r * .04); cc.lineTo(x + r * .30, y + r * .38);
          cc.lineTo(x - r * .30, y + r * .38); cc.lineTo(x - r * .30, y + r * .04);
          cc.closePath(); cc.fill(); cc.stroke(); cc.restore();
        },
        onTap: function () { G.home(); }
      });
    }
    var mx = (cur.back !== false && curName !== 'giungla') ? W - 152 : W - 60;
    ui.round({
      x: mx, y: 48, r: 34, color: G.save.mute ? '#b9ada0' : G.C.cream, id: 'hud-mute',
      icon: function (cc, x, y, r) {
        cc.save(); cc.fillStyle = G.C.ink;
        cc.beginPath();
        cc.moveTo(x - r * .34, y - r * .14); cc.lineTo(x - r * .12, y - r * .14);
        cc.lineTo(x + r * .10, y - r * .38); cc.lineTo(x + r * .10, y + r * .38);
        cc.lineTo(x - r * .12, y + r * .14); cc.lineTo(x - r * .34, y + r * .14);
        cc.closePath(); cc.fill();
        cc.strokeStyle = G.C.ink; cc.lineWidth = r * .12; cc.lineCap = 'round';
        if (G.save.mute) {
          cc.beginPath(); cc.moveTo(x + r * .22, y - r * .20); cc.lineTo(x + r * .48, y + r * .20);
          cc.moveTo(x + r * .48, y - r * .20); cc.lineTo(x + r * .22, y + r * .20); cc.stroke();
        } else {
          cc.beginPath(); cc.arc(x + r * .16, y, r * .26, -.9, .9); cc.stroke();
          cc.beginPath(); cc.arc(x + r * .16, y, r * .46, -.9, .9); cc.stroke();
        }
        cc.restore();
      },
      onTap: function () {
        G.save.mute = !G.save.mute; G.saveNow();
        if (G.save.mute) G.hush(); else G.sfx('pop');
      }
    });
    // parent gear — long press only, so kids cannot wander into settings
    var gx = mx - 84, gy = 48, gr = 26;
    c.save();
    c.globalAlpha = .55 + gearHold * .45;
    c.fillStyle = G.C.cream;
    c.beginPath(); c.arc(gx, gy, gr + gearHold * 6, 0, 7); c.fill();
    c.fillStyle = G.C.ink;
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4 + G.t * .5;
      c.save(); c.translate(gx + Math.cos(a) * gr * .62, gy + Math.sin(a) * gr * .62); c.rotate(a);
      c.fillRect(-3, -5.5, 11, 11); c.restore();
    }
    c.beginPath(); c.arc(gx, gy, gr * .40, 0, 7); c.fill();
    c.fillStyle = G.C.cream; c.beginPath(); c.arc(gx, gy, gr * .17, 0, 7); c.fill();
    if (gearHold > 0) {
      c.strokeStyle = G.C.berry; c.lineWidth = 5; c.lineCap = 'round';
      c.beginPath(); c.arc(gx, gy, gr + 9, -Math.PI / 2, -Math.PI / 2 + gearHold * 6.283); c.stroke();
    }
    c.restore();
    uiRects.push({ key: 'hud-gear', x: gx - gr - 8, y: gy - gr - 8, w: (gr + 8) * 2, h: (gr + 8) * 2, hold: true, round: true, cx: gx, cy: gy, cr: gr + 10 });
  }

  /* ---------------------------------------------------------------- overlay */
  var ovl = document.getElementById('ovl');
  var ovlT = document.getElementById('ovl-t'), ovlI = document.getElementById('ovl-i');
  var ovlCb = null;
  function closeOvl(val) {
    ovl.classList.remove('on');
    ovlI.blur();
    var cb = ovlCb; ovlCb = null;
    if (cb) cb(val);
  }
  document.getElementById('ovl-y').addEventListener('click', function () { closeOvl(ovlI.value.trim()); });
  document.getElementById('ovl-n').addEventListener('click', function () { closeOvl(null); });
  ovlI.addEventListener('keydown', function (e) { if (e.key === 'Enter') closeOvl(ovlI.value.trim()); });
  G.prompt = function (title, initial, cb) {
    ovlT.textContent = title;
    ovlI.value = initial || '';
    ovlCb = cb;
    ovl.classList.add('on');
    setTimeout(function () { ovlI.focus(); ovlI.select(); }, 60);
  };
  G.overlayOpen = function () { return ovl.classList.contains('on'); };

  /* ------------------------------------------------------------ event wiring */
  function onDown(e) {
    if (G.overlayOpen()) return;
    G.resumeAudio();
    var p = toLogical(e.clientX, e.clientY);
    p.id = e.pointerId;
    pointer.x = p.x; pointer.y = p.y; pointer.down = true; pointer.id = e.pointerId;
    if (fade.dir !== 0) return;
    var hit = hitTest(p);
    if (hit) {
      if (hit.hold) { gearHold = 0.001; pressedKey = null; return; }
      pressedKey = hit.key;
      return;
    }
    pressedKey = null;
    if (cur && cur.onDown) cur.onDown(p);
  }
  function onMove(e) {
    if (G.overlayOpen()) return;
    var p = toLogical(e.clientX, e.clientY);
    p.id = e.pointerId;
    pointer.x = p.x; pointer.y = p.y;
    if (!pointer.down) return;
    if (gearHold > 0) {
      var g = hitTest(p);
      if (!g || !g.hold) gearHold = 0;
      return;
    }
    if (pressedKey) {
      var h = hitTest(p);
      if (!h || h.key !== pressedKey) pressedKey = null;
      return;
    }
    if (cur && cur.onMove) cur.onMove(p);
  }
  function onUp(e) {
    if (G.overlayOpen()) return;
    var p = toLogical(e.clientX, e.clientY);
    p.id = e.pointerId;
    pointer.x = p.x; pointer.y = p.y; pointer.down = false;
    gearHold = 0;
    if (pressedKey) {
      var hit = hitTest(p);
      if (hit && hit.key === pressedKey && hit.onTap) {
        if (!hit.silent) G.sfx('tap');
        var f = hit.onTap; pressedKey = null;
        f();
        return;
      }
      pressedKey = null;
      return;
    }
    if (cur && cur.onUp) cur.onUp(p);
  }
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); cv.setPointerCapture && cv.setPointerCapture(e.pointerId); onDown(e); });
  cv.addEventListener('pointermove', function (e) { e.preventDefault(); onMove(e); });
  cv.addEventListener('pointerup', function (e) { e.preventDefault(); onUp(e); });
  cv.addEventListener('pointercancel', function (e) { pointer.down = false; pressedKey = null; gearHold = 0; if (cur && cur.onUp) cur.onUp({ x: pointer.x, y: pointer.y, id: e.pointerId }); });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('blur', function () { pointer.down = false; pressedKey = null; gearHold = 0; });

  /* ------------------------------------------------------------------- loop */
  var last = 0, running = true;
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (!running) { writeSave(); G.hush(); }
    else { last = 0; G.resumeAudio(); }
  });
  window.addEventListener('pagehide', writeSave);
  window.addEventListener('beforeunload', writeSave);

  function frame(ts) {
    requestAnimationFrame(frame);
    if (!running) return;
    if (!last) last = ts;
    var dt = Math.min((ts - last) / 1000, .05);
    last = ts;
    G.dt = dt; G.t += dt; G.frame++;

    if (G.account) G.save.playSec += dt;

    // gear long-press
    if (gearHold > 0 && pointer.down) {
      gearHold = Math.min(1, gearHold + dt / 1.4);
      if (gearHold >= 1) {
        gearHold = 0; pointer.down = false; G.sfx('chime');
        G.go('gate', { then: 'genitori', back: curName });

    // autosave
    if (saveDirty) { saveTimer += dt; if (saveTimer > .8) { saveTimer = 0; writeSave(); } }

    // fade / scene swap
    if (fade.dir === 1) {
      fade.a += dt / .20;

        // redirect straight to another scene; if it did, honour that instead.
        fade.dir = 0;
        swap();
        if (fade.dir !== 1) fade.dir = -1;
      }
    } else if (fade.dir === -1) {
      fade.a -= dt / .22;
      if (fade.a <= 0) { fade.a = 0; fade.dir = 0; }
    }

    if (cur && cur.update && fade.dir !== 1) { try { cur.update(dt); } catch (e) { console.error(e); } }
    stepFx(dt);

    // ---- render
    uiHot = uiRects; uiRects = [];
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.fillStyle = '#0b2418';
    ctx.fillRect(0, 0, cv.width / view.dpr, cv.height / view.dpr);
    ctx.setTransform(view.dpr * view.s, 0, 0, view.dpr * view.s, view.dpr * view.ox, view.dpr * view.oy);
    ctx.save();
    // Clip first, shake second: otherwise the shake drags the letterbox in.
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    if (shakeAmt > 0) ctx.translate(G.rnd(-shakeAmt, shakeAmt), G.rnd(-shakeAmt, shakeAmt));

    if (cur && cur.draw) { try { cur.draw(ctx); } catch (e) { console.error(e); } }
    drawParts(ctx);
    drawHUD(ctx);
    drawFlyers(ctx);

    ctx.restore();
    if (fade.a > 0) {
      ctx.fillStyle = 'rgba(9,32,21,' + fade.a.toFixed(3) + ')';
      ctx.fillRect(-200, -200, W + 400, H + 400);
    }
  }
  requestAnimationFrame(frame);

  /* --------------------------------------------------------------- boot API */
  G.start = function (name, params) {
    cur = scenes[name]; curName = name; G.current = name;
    if (cur && cur.enter) cur.enter(params || null);
    fade.a = 1; fade.dir = -1;
  };
})();


/* ==================== 01-art-kart.js ==================== */
/* Dino Kart — the kart seen from behind (namespace `A`).

   THE ONE ANGLE. In Dino Giungla the dino is drawn in profile, and that is fine
   because everything there is seen from the side or from above. A racer looks
   down the road, so we need him from behind — and from behind ONLY. Turning a
   drawn character through 360 degrees means drawing it from eight angles, which
   would be by a distance the most expensive art either project has been asked
   for. Here the whole kart leans and squashes instead: one drawing, plus a lean
   term, reads as a kart that turns. That is the trick that makes this project
   affordable at all.

   (x, y) is where the kart meets the road: the contact point, like everywhere
   else in these two games. `s` is the width of the kart in screen pixels, so
   the caller can scale it by distance for the rivals and never think about it
   again.

   o = { color, lean: -1..1, bob: 0..1, hat: id|null, boost: 0..1 } */
(function () {
  'use strict';

  var G = window.G || {};
  var C = G.C || {};
  var A = window.A || (window.A = {});
  var INK = C.ink || '#2b1d12';
  var TAU = 6.2831853;

  function _shade(col, amt) { return G.shade ? G.shade(col, amt) : col; }
  function _lw(s) { return Math.max(1.4, Math.min(6, s * 0.028)); }
  function _ell(c, x, y, rx, ry, rot) {
    rx = Math.max(0.2, rx); ry = Math.max(0.2, ry); rot = rot || 0;
    c.beginPath();
    c.moveTo(x + rx * Math.cos(rot), y + rx * Math.sin(rot));
    c.ellipse(x, y, rx, ry, rot, 0, TAU);
  }
  function _shape(c, col, lw) {
    c.lineJoin = 'round'; c.lineCap = 'round';
    if (lw > 0) { c.strokeStyle = INK; c.lineWidth = lw * 2; c.stroke(); }
    c.fillStyle = col; c.fill();
  }

  A.kartBack = function (c, x, y, s, o) {
    o = o || {};
    var col = o.color || C.dino || '#57c98a';
    var lean = Math.max(-1, Math.min(1, o.lean || 0));
    var bob = (o.bob || 0) * s * 0.012;
    var lw = _lw(s);
    var w = s, h = s * 0.56;

    c.save();
    c.translate(x, y + bob);
    /* The lean is doing all the work of a turn: the body rolls, and the whole
       thing shifts a little into the corner. Small numbers on purpose — past
       about eight degrees it reads as falling over rather than cornering. */
    c.rotate(lean * 0.14);
    c.translate(lean * s * 0.05, 0);

    // ground shadow, drawn unrotated-ish so it stays flat on the road
    c.save();
    c.globalAlpha = 0.26; c.fillStyle = '#1a1206';
    _ell(c, 0, 4, w * 0.56, h * 0.16, 0); c.fill();
    c.restore();

    // rear wheels: fat, and the only thing that says "this is behind you"
    var ww = w * 0.24, wh = h * 0.52;
    [-1, 1].forEach(function (sd) {
      c.beginPath();
      G.roundRect(c, sd * w * 0.5 - (sd > 0 ? 0 : ww), -wh, ww, wh, ww * 0.28);
      _shape(c, '#2f2a30', lw);
      c.fillStyle = '#8d8a92';
      c.beginPath();
      c.arc(sd * (w * 0.5 - ww * 0.5) - (sd > 0 ? 0 : 0), -wh * 0.5, ww * 0.20, 0, TAU);
      c.fill();
    });

    // the shell: a rounded box, wider at the bottom
    c.beginPath();
    c.moveTo(-w * 0.40, -h * 0.10);
    c.lineTo(-w * 0.34, -h * 0.86);
    c.lineTo(w * 0.34, -h * 0.86);
    c.lineTo(w * 0.40, -h * 0.10);
    c.closePath();
    _shape(c, col, lw);

    // a lighter panel, so the shell is not a flat blob
    c.save();
    c.globalAlpha = 0.35;
    c.beginPath();
    c.moveTo(-w * 0.30, -h * 0.22);
    c.lineTo(-w * 0.25, -h * 0.72);
    c.lineTo(w * 0.02, -h * 0.72);
    c.lineTo(w * 0.02, -h * 0.22);
    c.closePath();
    c.fillStyle = '#ffffff'; c.fill();
    c.restore();

    // exhausts
    c.fillStyle = '#4a4550';
    [-1, 1].forEach(function (sd) {
      c.beginPath();
      c.ellipse(sd * w * 0.22, -h * 0.14, w * 0.05, h * 0.06, 0, 0, TAU);
      c.fill();
    });
    if (o.boost > 0.02) {
      c.save();
      c.globalAlpha = Math.min(0.85, o.boost);
      [-1, 1].forEach(function (sd) {
        var fg = c.createLinearGradient(0, -h * 0.14, 0, h * 0.5);
        fg.addColorStop(0, C.sun || '#ffd75e');
        fg.addColorStop(1, 'rgba(255,120,40,0)');
        c.fillStyle = fg;
        c.beginPath();
        c.moveTo(sd * w * 0.17, -h * 0.14);
        c.lineTo(sd * w * 0.27, -h * 0.14);
        c.lineTo(sd * w * 0.22, h * 0.42 * (0.5 + o.boost));
        c.closePath(); c.fill();
      });
      c.restore();
    }

    /* The dino, from behind. No face — that is the point, and it is why one
       drawing is enough: the back of a head does not need to turn. */
    var hy = -h * 1.02, hr = s * 0.17;

    // shoulders rising out of the seat
    c.beginPath();
    _ell(c, 0, -h * 0.80, s * 0.20, s * 0.13, 0);

      c.beginPath();
      G.roundRect(c, sd * s * 0.20 - (sd > 0 ? 0 : s * 0.09), -h * 0.92, s * 0.09, s * 0.15, s * 0.04);
      _shape(c, _shade(col, -18), lw * 0.8);
    });

    // head
    c.beginPath();
    _ell(c, 0, hy, hr, hr * 0.94, 0);
    _shape(c, col, lw);

    // the crest, seen end-on: three spikes down the middle of the skull
    c.beginPath();
    [0, 1, 2].forEach(function (i) {
      var sx = (i - 1) * hr * 0.52;
      c.moveTo(sx - hr * 0.13, hy - hr * 0.62);
      c.lineTo(sx, hy - hr * (i === 1 ? 1.20 : 1.00));
      c.lineTo(sx + hr * 0.13, hy - hr * 0.62);
      c.closePath();
    });
    _shape(c, _shade(col, -26), lw * 0.8);

    // a sliver of cheek on each side, so the head reads as a head
    c.save();
    c.globalAlpha = 0.30;
    c.fillStyle = C.pinkPop || '#ff6fae';
    _ell(c, -hr * 0.72, hy + hr * 0.16, hr * 0.22, hr * 0.15, 0); c.fill();
    _ell(c, hr * 0.72, hy + hr * 0.16, hr * 0.22, hr * 0.15, 0); c.fill();
    c.restore();

    /* His hat, if he is wearing one — the same eight hats as Dino Giungla when
       that art is present, so the brand carries across. Nothing breaks if it
       is not: the head is simply bare. */
    if (o.hat && A.hat) {
      c.save();
      A.hat(c, 0, hy - hr * 0.86, hr * 1.9, o.hat);
      c.restore();
    }

    c.restore();
  };

  /* A pill of text on a dark slab. Everything the race HUD says goes through
     this, so the four readouts cannot drift apart in style. */
  A.pill = function (c, x, y, w, h, label, value, col) {
    c.save();
    c.fillStyle = 'rgba(14,20,34,.66)';
    G.roundRect(c, x, y, w, h, h * 0.28); c.fill();
    c.strokeStyle = 'rgba(255,246,224,.22)'; c.lineWidth = 2;
    G.roundRect(c, x, y, w, h, h * 0.28); c.stroke();
    c.restore();
    if (label) {
      G.text(label, x + w / 2, y + h * 0.30, {
        ctx: c, size: h * 0.24, color: 'rgba(255,246,224,.7)', weight: 800
      });
    }
    G.text(String(value), x + w / 2, y + h * (label ? 0.70 : 0.52), {
      ctx: c, size: h * (label ? 0.42 : 0.56), color: col || (C.sun || '#ffd75e')
    });
  };

  /* Le tre cose che si tirano. Disegnate una volta e riscalate dalla distanza,
     esattamente come i kart: quello che vola deve rimpicciolire con la strada o
     smette di sembrare che stia sulla strada.

     (x, y) è il centro dell'oggetto in volo, `s` la sua larghezza sullo
     schermo, `ph` una fase che scorre per farlo girare e ronzare. */
  A.arma = function (c, x, y, s, kind, ph) {
    ph = ph || 0;
    var lw = _lw(s * 1.6);
    c.save();
    c.translate(x, y);

    if (kind === 'cocco') {
      c.rotate(ph * 5);
      c.beginPath();
      _ell(c, 0, 0, s * 0.5, s * 0.44, 0);
      _shape(c, '#8a5a2c', lw);
      c.fillStyle = '#5e3a18';
      [[-0.16, -0.10], [0.16, -0.10], [0, 0.16]].forEach(function (p) {
        c.beginPath(); c.arc(p[0] * s, p[1] * s, s * 0.075, 0, TAU); c.fill();
      });
      // tre peli, perché una noce di cocco senza peli è un sasso
      c.strokeStyle = '#6b4420'; c.lineWidth = Math.max(1, s * 0.05);
      [-0.5, 0, 0.5].forEach(function (a) {
        c.beginPath();
        c.moveTo(Math.sin(a) * s * 0.3, -s * 0.38);
        c.lineTo(Math.sin(a) * s * 0.44, -s * 0.62);
        c.stroke();
      });

    } else if (kind === 'api') {
      /* Uno sciame: una nuvoletta e tre api che ci girano dentro. Il movimento
         è tutto nella fase, così lo sciame non è mai fermo. */
      c.save();
      c.globalAlpha = 0.16; c.fillStyle = '#fff6e0';
      _ell(c, 0, 0, s * 0.66, s * 0.52, 0); c.fill();
      c.restore();
      for (var i = 0; i < 3; i++) {
        var a = ph * 7 + i * 2.1;
        var bx = Math.cos(a) * s * 0.34, by = Math.sin(a * 1.3) * s * 0.26;
        c.beginPath();
        _ell(c, bx, by, s * 0.21, s * 0.17, 0);
        _shape(c, '#ffe066', lw * 0.7);
        c.fillStyle = INK;
        c.fillRect(bx - s * 0.07, by - s * 0.16, s * 0.06, s * 0.32);
      }

    } else {
      // fulmine: una saetta, se mai dovesse volare invece di colpire subito
      c.beginPath();
      c.moveTo(-s * 0.18, -s * 0.5);
      c.lineTo(s * 0.22, -s * 0.08);
      c.lineTo(s * 0.02, -s * 0.04);
      c.lineTo(s * 0.2, s * 0.5);
      c.lineTo(-s * 0.22, s * 0.02);
      c.lineTo(-s * 0.02, -s * 0.02);
      c.closePath();
      _shape(c, '#7fd7ff', lw);
    }
    c.restore();
  };

  A._kart_ok = true;
})();


/* ==================== 03-profili.js ==================== */
/* Chi sta guidando: profili, segreto a figure, colore del kart.

   Portato da Dino Giungla e non reinventato, perché i due giochi stanno sullo
   stesso tablet e nelle stesse mani: se il modo di dire "sono io" cambia fra un
   gioco e l'altro, il bambino deve impararlo due volte.

   Tre differenze, tutte dovute al fatto che questo è un gioco di corse:
     - l'anteprima è il KART, non il dino di profilo. Qui il dino esiste solo di
       spalle, e mostrarlo di lato sarebbe promettere un disegno che non c'è.
     - la domanda sull'età non apre giochi diversi, sceglie la DIFFICOLTÀ di
       partenza: Piccolo parte da Facile, Grande da Gara. Poi si cambia dal
       menu quando si vuole.
     - niente `A.jungle` da cui pescare uno sfondo, quindi lo sfondo è lo stesso
       cielo notturno e la stessa striscia d'asfalto del menu.

   Il segreto è tre figure, non una password: un bambino di tre anni non sa
   scrivere ma ricorda benissimo "cuore, stella, luna". Non è sicurezza, è una
   serratura di famiglia — tiene due fratelli fuori dai progressi l'uno
   dell'altro, e nient'altro. */
(function () {
  'use strict';

  var C = G.C, W = G.W, H = G.H;
  var TAU = 6.2831853;

  var COLORS = [C.dino, C.blueberry, C.pinkPop, C.tangerine, C.plum, C.water];

  /* Le nove figure del segreto. Disegnate qui perché Dino Kart non porta con sé
     la libreria di forme di Dino Giungla, e nove forme sono più economiche di
     una dipendenza. Forma E colore insieme: un bambino che non distingue ancora
     un rombo da un quadrato distingue benissimo l'azzurro dal blu. */
  var KEYS = [
    { k: 'cerchio', col: C.berry },
    { k: 'quadrato', col: C.blueberry },
    { k: 'triangolo', col: C.mint },
    { k: 'cuore', col: C.pinkPop },
    { k: 'stella', col: C.sun },
    { k: 'fiore', col: C.plum },
    { k: 'luna', col: C.tangerine },
    { k: 'rombo', col: C.water },
    { k: 'quadrato', col: C.leafLight }
  ];

  function icon(c, x, y, r, i) {
    var s = KEYS[i % KEYS.length];
    var j;
    c.save();
    c.translate(x, y);
    c.beginPath();
    if (s.k === 'cerchio') {
      c.arc(0, 0, r, 0, TAU);
    } else if (s.k === 'quadrato') {
      G.roundRect(c, -r * 0.86, -r * 0.86, r * 1.72, r * 1.72, r * 0.24);
    } else if (s.k === 'triangolo') {
      c.moveTo(0, -r); c.lineTo(r * 0.92, r * 0.72); c.lineTo(-r * 0.92, r * 0.72); c.closePath();
    } else if (s.k === 'rombo') {
      c.moveTo(0, -r); c.lineTo(r, 0); c.lineTo(0, r); c.lineTo(-r, 0); c.closePath();
    } else if (s.k === 'cuore') {
      c.moveTo(0, r * 0.9);
      c.bezierCurveTo(-r * 1.5, -r * 0.15, -r * 0.55, -r * 1.15, 0, -r * 0.34);
      c.bezierCurveTo(r * 0.55, -r * 1.15, r * 1.5, -r * 0.15, 0, r * 0.9);
      c.closePath();
    } else if (s.k === 'stella') {
      for (j = 0; j < 10; j++) {
        var a = -Math.PI / 2 + j * Math.PI / 5;
        var rr = j % 2 ? r * 0.46 : r;
        if (j === 0) c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        else c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      c.closePath();
    } else if (s.k === 'luna') {
      c.arc(0, 0, r, Math.PI * 0.42, Math.PI * 1.58);
      c.arc(-r * 0.42, 0, r * 0.92, Math.PI * 1.52, Math.PI * 0.48, true);
      c.closePath();
    } else {                                   // fiore
      for (j = 0; j < 5; j++) {
        var b = -Math.PI / 2 + j * TAU / 5;
        c.moveTo(0, 0);
        c.arc(Math.cos(b) * r * 0.52, Math.sin(b) * r * 0.52, r * 0.48, 0, TAU);
      }
    }
    c.fillStyle = s.col; c.fill();
    c.strokeStyle = 'rgba(20,14,8,.55)'; c.lineWidth = Math.max(2, r * 0.12); c.stroke();
    c.restore();
  }

  /* Lo sfondo: lo stesso del menu, così passare dal profilo alla gara non
     sembra passare da un gioco a un altro. */
  function backdrop(c, title) {
    var sky = c.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#1b2740');
    sky.addColorStop(0.55, '#3d5b86');
    sky.addColorStop(1, '#7a9ec4');
    c.fillStyle = sky; c.fillRect(0, 0, W, H);
    c.fillStyle = '#5d6169'; c.fillRect(0, H - 92, W, 92);
    c.fillStyle = '#494d55'; c.fillRect(0, H - 92, W, 8);
    c.fillStyle = 'rgba(255,246,224,.6)';
    for (var i = 0; i < 9; i++) c.fillRect(40 + i * 150, H - 52, 84, 10);
    if (title) {
      G.text(title, W / 2, 66, {
        ctx: c, size: 54, color: C.sun, stroke: 'rgba(12,20,40,.85)', strokeWidth: 12
      });
    }
  }

  function kartPreview(c, x, y, s, color, wob) {
    if (A.kartBack) {
      A.kartBack(c, x, y, s, { color: color, lean: Math.sin(G.t * 1.5 + (wob || 0)) * 0.3, bob: Math.sin(G.t * 3) * 0.5 });
      return;
    }
    c.fillStyle = color; c.fillRect(x - s / 2, y - s * 0.4, s, s * 0.4);
  }

  /* ------------------------------------------------------- scena: accesso */
  G.scene('accesso', {
    hud: false, back: false,

    enter: function () {
      var n = G.accounts.list().length;
      setTimeout(function () {
        if (G.current !== 'accesso') return;
        G.say(n ? 'Chi guida oggi?' : 'Benvenuto! Facciamo il tuo pilota.');
      }, 460);
    },

    draw: function (c) {
      backdrop(c, 'Chi guida?');

      var items = G.accounts.list().slice(0, 5);
      var n = items.length + 1;
      var cw = 210, gap = 22;
      var x0 = (W - (n * cw + (n - 1) * gap)) / 2, y = 150, ch = 340;

      items.forEach(function (a, i) {
        var x = x0 + i * (cw + gap);
        var wob = Math.sin(G.t * 1.6 + i) * 4;
        c.save();
        c.fillStyle = 'rgba(14,20,34,.55)';
        G.roundRect(c, x, y + wob, cw, ch, 26); c.fill();
        c.strokeStyle = 'rgba(255,246,224,.22)'; c.lineWidth = 2;
        G.roundRect(c, x, y + wob, cw, ch, 26); c.stroke();
        c.restore();

        kartPreview(c, x + cw / 2, y + wob + 210, 148, a.color, i);
        G.text(a.name, x + cw / 2, y + wob + 258, {
          ctx: c, size: 32, color: C.cream, maxWidth: cw - 24
        });

        c.save();
        c.fillStyle = a.level === 2 ? C.berry : C.mint;
        G.roundRect(c, x + cw / 2 - 58, y + wob + 282, 116, 32, 16); c.fill();
        c.restore();
        G.text(a.level === 2 ? 'Gara' : 'Facile', x + cw / 2, y + wob + 299, {
          ctx: c, size: 21, color: '#fff'
        });

        // il lucchetto: un puntino, non una spiegazione
        if (a.secret) {
          c.save(); c.globalAlpha = 0.9;
          icon(c, x + cw - 28, y + wob + 28, 13, 4);
          c.restore();
        }

        G.ui.button({
          id: 'acct' + a.id, x: x, y: y + wob, w: cw, h: ch, r: 26, ghost: true,
          onTap: function () {
            if (a.secret) G.go('segreto', { id: a.id });
            else { G.accounts.login(a.id); G.go('menu'); }
          }
        });
      });

      var xn = x0 + items.length * (cw + gap);
      var wn = Math.sin(G.t * 1.6 + items.length) * 4;
      G.ui.button({
        id: 'nuovo', x: xn, y: y + wn, w: cw, h: ch, r: 26, color: C.leaf,
        icon: function (cc, cx, cy) {
          cc.save();
          cc.strokeStyle = '#fff'; cc.lineWidth = 15; cc.lineCap = 'round';
          cc.beginPath();
          cc.moveTo(cx, cy - 92); cc.lineTo(cx, cy - 20);
          cc.moveTo(cx - 36, cy - 56); cc.lineTo(cx + 36, cy - 56);
          cc.stroke(); cc.restore();
        },
        onTap: function () { G.go('nuovo'); }
      });
      G.text('Nuovo', xn + cw / 2, y + wn + ch - 88, { ctx: c, size: 32, color: '#fff' });
      G.text('pilota', xn + cw / 2, y + wn + ch - 52, { ctx: c, size: 28, color: '#fff' });

      if (items.length) {
        G.ui.round({
          id: 'gestisci', x: W - 54, y: H - 50, r: 28, color: 'rgba(255,246,224,.5)',
          icon: function (cc, x, yy, r) {
            cc.save(); cc.fillStyle = C.ink;
            for (var i = 0; i < 8; i++) {
              var a = i * Math.PI / 4 + G.t * 0.4;
              cc.save();
              cc.translate(x + Math.cos(a) * r * 0.5, yy + Math.sin(a) * r * 0.5);
              cc.rotate(a); cc.fillRect(-3, -5, 10, 10); cc.restore();
            }
            cc.beginPath(); cc.arc(x, yy, r * 0.32, 0, TAU); cc.fill();
            cc.fillStyle = 'rgba(255,246,224,.9)';
            cc.beginPath(); cc.arc(x, yy, r * 0.13, 0, TAU); cc.fill();
            cc.restore();
          },
          onTap: function () { G.go('gate'); }
        });
      }
    }
  });

  /* ------------------------------------------------------- scena: segreto */
  var sg = { id: null, taps: [], shake: 0, fails: 0 };

  G.scene('segreto', {
    hud: false, back: false,
    enter: function (p) {
      sg.id = p && p.id; sg.taps = []; sg.shake = 0; sg.fails = 0;
      var a = G.accounts.byId(sg.id);
      setTimeout(function () {
        if (G.current !== 'segreto') return;
        G.say('Ciao ' + (a ? a.name : '') + '! Tocca il tuo segreto.');
      }, 400);
    },
    update: function (dt) { if (sg.shake > 0) sg.shake = Math.max(0, sg.shake - dt * 4); },
    draw: function (c) {

      kartPreview(c, 250, 520, 200, a.color, 0);
      G.text('Ciao ' + a.name + '!', 250, 178, {
        ctx: c, size: 48, color: C.sun, stroke: 'rgba(12,20,40,.8)', strokeWidth: 11
      });
      G.text('Tocca il tuo segreto', 250, 232, {
        ctx: c, size: 27, color: C.cream, weight: 700
      });

      var i;
      for (i = 0; i < 3; i++) {
        var sx = 250 + (i - 1) * 74, sy = 290;
        c.save();
        c.fillStyle = 'rgba(255,246,224,.24)';
        c.beginPath(); c.arc(sx, sy, 27, 0, TAU); c.fill();
        c.restore();
        if (sg.taps[i] !== undefined) icon(c, sx, sy, 21, sg.taps[i]);
      }

      var px = 690, py = 132, cell = 148, gap = 14;

      for (i = 0; i < 9; i++) {
        (function (idx) {
          var bx = px + (idx % 3) * (cell + gap) + jitter;
          var by = py + Math.floor(idx / 3) * (cell + gap);
          G.ui.button({
            id: 'sk' + idx, x: bx, y: by, w: cell, h: cell, r: 24, color: C.cream,
            icon: function (cc, cx, cy) { icon(cc, cx, cy, cell * 0.29, idx); },
            onTap: function () {
              sg.taps.push(idx);
              G.sfx('pop');
              if (sg.taps.length < 3) return;

              if (ok) {

            id: 'col' + k, x: x0 + k * (bw + bg), y: 140, w: bw, h: 116, r: 24, color: col,
            icon: function (cc, cx, cy) {
              if (nu.color !== col) return;
